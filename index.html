<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Place an Order</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

<div id="order-box">
  <h1>Place an Order</h1>

  <label>Your Name:</label>
  <input type="text" id="name">

  <label>Item:</label>
  <select id="items">
    <option value="Latte">Latte - $4.50 </option>
    <option value="Pizza">Pizza $10.00 </option>
    <option value="Lemon">Lemon $100.00 </option>
  </select>

  <label>Quantity:</label>
  <input type="text" id="quantity">

  <button id="order-button">Order Now</button>

  <h2 id="message"></h2>

</div>

<script src="app.js"></script>
</body>
</html>
